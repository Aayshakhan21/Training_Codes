# ============================================================
# AppVerse AI – Application Configuration
# ============================================================

# Server
server.port=8080
spring.application.name=appverse-backend

# ─── Database ───────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/appverse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA / Hibernate ────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── JWT ────────────────────────────────────────────────────
app.jwt.secret=AppVerseAISecretKey2024SuperLongSecretKeyForJWTSigning!@#$%
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ─── CORS ───────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000
app.ai-service.base-url=http://ai-service:8001/api/ai

# ─── File Upload ────────────────────────────────────────────
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ─── Mail ───────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Swagger ────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─── Logging ────────────────────────────────────────────────
logging.level.com.appverse=DEBUG
logging.level.org.springframework.security=WARN

services:
  mysql:
    image: mysql:8.0
    container_name: appverse-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appverse_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: appverse-backend
    depends_on:
      - mysql
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/appverse_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
      APP_AI_SERVICE_BASE_URL: http://ai-service:8001/api/ai
    ports:
      - "8080:8080"

  ai-service:
    build:
      context: ./ai-service
    container_name: appverse-ai-service
    env_file:
      - ./ai-service/.env
    ports:
      - "8001:8001"

  frontend:
    build:
      context: ./frontend
    container_name: appverse-frontend
    depends_on:
      - backend
      - ai-service
    ports:
      - "5173:80"

volumes:
  mysql_data:
